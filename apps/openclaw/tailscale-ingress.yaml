apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw-tailscale
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/part-of: openclaw
  annotations:
    argocd.argoproj.io/tracking-id: openclaw:networking.k8s.io/Ingress:openclaw/openclaw-tailscale
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openclaw
                port:
                  number: 18789
  tls:
    - hosts:
        - openclaw
