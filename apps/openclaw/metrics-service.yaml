apiVersion: v1
kind: Service
metadata:
  name: openclaw-metrics
  namespace: openclaw
  labels:
    app.kubernetes.io/name: openclaw
    app.kubernetes.io/part-of: openclaw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: openclaw
    app.kubernetes.io/name: openclaw
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

