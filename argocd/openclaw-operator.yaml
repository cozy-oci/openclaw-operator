apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bahn1075/openclaw-operator.git
    targetRevision: main
    path: charts/openclaw-operator
    helm:
      releaseName: openclaw-operator
      valueFiles:
        - values-oke.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

