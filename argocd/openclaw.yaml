apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cozy-oci/openclaw-operator.git
    targetRevision: main
    path: apps/openclaw
  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: openclaw.rocks
      kind: OpenClawInstance
      name: openclaw
      namespace: openclaw
      jsonPointers:
        - /spec/image/tag
